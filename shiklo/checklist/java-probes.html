<!-- P7b: does javac (TeaVM) write the -0.0 constant? CONSTANT_Double is tag 6 + 8 bytes; -0.0 is 80 00 .. 00. -->
<script type="text/x-java" data-id="P7b" data-name="bug 7: is the -0.0 constant in the class file javac wrote?">
public class Main {
    public static void main(String[] a) throws Exception {
        double v = -0.0;
        try (var in = Main.class.getResourceAsStream("Main.class")) {
            if (in == null) { System.out.println("no class file to read"); return; }
            byte[] b = in.readAllBytes();
            boolean found = false;
            for (int i = 0; i + 8 < b.length && !found; i++) {
                if (b[i] != 6 || b[i + 1] != (byte) 0x80) continue;
                boolean zeros = true;
                for (int k = 2; k <= 8; k++) zeros &= b[i + k] == 0;
                found = zeros;
            }
            System.out.println("-0.0 in the constant pool: " + found);
        }
        System.out.println(1.0 / v);
    }
}
</script>

import java.util.*;
import java.util.concurrent.*;
public class Main {
    public static void main(String[] a) throws Exception {
        ExecutorService pool = Executors.newFixedThreadPool(3);
        List<Future<Integer>> fs = new ArrayList<>();
        for (int i = 1; i <= 5; i++) { int k = i; fs.add(pool.submit(() -> k * k)); }

import java.util.concurrent.*;
public class Main {
    public static void main(String[] a) throws Exception {
        CountDownLatch latch = new CountDownLatch(3);
        for (int i = 0; i < 3; i++) new Thread(latch::countDown).start();
        latch.await();
        System.out.println("latch " + latch.getCount());
        CyclicBarrier barrier = new CyclicBarrier(2, () -> System.out.println("barrier tripped"));
        Thread bt = new Thread(() -> { try { barrier.await(); } catch (Exception e) {} });
        bt.start(); barrier.await(); bt.join();
        Semaphore sem = new Semaphore(2); sem.acquire();
        System.out.println("permits " + sem.availablePermits());
        BlockingQueue<Integer> q = new LinkedBlockingQueue<>();
        Thread prod = new Thread(() -> { for (int i = 1; i <= 3; i++) q.add(i); q.add(-1); });
        prod.start();
        int got = 0, v;
        while ((v = q.take()) != -1) got += v;
        System.out.println("queue " + got);
    }
}
</script>

<!-- P12k: P12a (untimed get straight after submit; P12g-j wait with timeouts and pass) with a watchdog that, if the
     program is still running after 3 s, prints the futures, the pool and where every thread is. -->
<script type="text/x-java" data-id="P12k" data-name="bug 12: P12a with a watchdog that shows where each thread waits">
import java.util.*;
import java.util.concurrent.*;
public class Main {
    public static void main(String[] a) throws Exception {
        ExecutorService pool = Executors.newFixedThreadPool(3);
        List<Future<Integer>> fs = new ArrayList<>();
        for (int i = 1; i <= 5; i++) { int k = i; fs.add(pool.submit(() -> k * k)); }
        Thread dog = new Thread(() -> {
            try { Thread.sleep(3000); } catch (InterruptedException e) { return; }
            StringBuilder sb = new StringBuilder("WATCHDOG futures:");
            for (Future<Integer> f : fs) sb.append(' ').append(f.state());
            sb.append("\nWATCHDOG ").append(pool);
            try {
                for (Map.Entry<Thread, StackTraceElement[]> e : Thread.getAllStackTraces().entrySet()) {
                    sb.append("\nWATCHDOG thread ").append(e.getKey().getName()).append(' ').append(e.getKey().getState());
                    StackTraceElement[] st = e.getValue();
                    for (int i = 0; i < Math.min(6, st.length); i++) sb.append("\n    at ").append(st[i]);
                }
            } catch (Throwable t) { sb.append("\nWATCHDOG no thread dump: ").append(t); }
            System.out.println(sb);
        });
        dog.setDaemon(true);
        dog.start();
        int sum = 0;
        for (Future<Integer> f : fs) sum += f.get();
        System.out.println(sum);
        pool.shutdown();
        System.out.println(pool.awaitTermination(2, TimeUnit.SECONDS));
    }
}
</script>

<!-- P12g-j: where the fixed pool (P12a) stops. Each get has a 3 s timeout; on a timeout the line shows the task
     counters and the pool's own state, so the report says how far it got (a real JDK prints only the "got" lines). -->
<script type="text/x-java" data-id="P12g" data-name="bug 12: fixed pool of 3, five tasks, progress">
import java.util.*;
import java.util.concurrent.*;
import java.util.concurrent.atomic.*;
public class Main {
    public static void main(String[] a) throws Exception {
        ExecutorService pool = Executors.newFixedThreadPool(3);
        AtomicInteger started = new AtomicInteger(), done = new AtomicInteger();
        List<Future<Integer>> fs = new ArrayList<>();
        for (int i = 1; i <= 5; i++) { int k = i; fs.add(pool.submit(() -> { started.incrementAndGet(); int r = k * k; done.incrementAndGet(); return r; })); }
        System.out.println("submitted");
        for (int i = 0; i < 5; i++) {
            try { System.out.println("got " + fs.get(i).get(3, TimeUnit.SECONDS)); }
            catch (TimeoutException e) { System.out.println("timeout at " + (i + 1) + ": started " + started + ", done " + done + ", " + pool); }
        }
        pool.shutdownNow();
    }
}
</script>

<!-- P12l: the cause of P12a without a pool. The host runs two calls on the main thread per program (runCompiled, then
     takeLastIsolationReport) and the scheduler cleared the main thread's eetop when a call ended, so from the second
     program of a VM on, unpark(main) was dropped: an untimed park never woke and isAlive() said false. It must not be
     the first program of a VM (a crash or time-out before it starts a new one), so it comes after P12g-j, which pass. -->
<script type="text/x-java" data-id="P12l" data-name="bug 12: main thread parks without a timeout, another thread unparks it">
import java.util.concurrent.locks.LockSupport;
public class Main {
    public static void main(String[] a) throws Exception {
        Thread main = Thread.currentThread();
        System.out.println(main.isAlive());
        Thread t = new Thread(() -> {
            try { Thread.sleep(100); } catch (InterruptedException e) { return; }
            LockSupport.unpark(main);
        });
        t.start();
        LockSupport.park();
        System.out.println("woke");
        t.join();
    }
}
</script>

true

</script>

public class Main {
    public static void main(String[] args) throws Exception {
        try (ServerSocket server = new ServerSocket(0)) {
            int port = server.getLocalPort();
            Thread client = new Thread(() -> { try (Socket s = new Socket("localhost", port); PrintWriter out = new PrintWriter(s.getOutputStream(), true); BufferedReader in = new BufferedReader(new InputStreamReader(s.getInputStream()))) { out.println("ping"); System.out.println("client got " + in.readLine()); } catch (IOException e) { System.out.println("client " + e); } });
            client.start();
            try (Socket c = server.accept(); BufferedReader in = new BufferedReader(new InputStreamReader(c.getInputStream())); PrintWriter out = new PrintWriter(c.getOutputStream(), true)) { System.out.println("server got " + in.readLine()); out.println("pong"); }
            client.join();
        }
        try { new Socket("localhost", 1); } catch (ConnectException e) { System.out.println("refused"); }
    }
}

<script type="module">
  import { createJava } from "./java-engine.js";
  const out = document.getElementById("out");
  const say = (s) => { out.textContent += s + "\n"; };
  const only = new URLSearchParams(location.search).get("only");
  const want = only ? new Set(only.split(",")) : null;
  // ?rt=<folder under vendor/> runs the checks on another runtime build (e.g. tracejvm-fork-3/runtime); default 0.4.1.
  const rt = new URLSearchParams(location.search).get("rt") || "tracejvm-0.4.1/runtime";
  const BASE = new URL(`./vendor/${rt}/`, location.href).href;
  const enc = new TextEncoder();
  const text = (el) => (el ? el.textContent.replace(/^\n/, "") : "");
  const results = [];
  try {
    const java = createJava({ base: BASE });
    const t0 = performance.now();
    await java.ready;
    say(`INFO engine ready ${Math.round(performance.now() - t0)} ms`);
    for (const el of document.querySelectorAll('script[type="text/x-java"]')) {
      const id = el.dataset.id;
      if (want && !want.has(id)) continue;
      const expect = text(document.querySelector(`script[data-out="${id}"]`));
      const c = await java.compile({ "Main.java": text(el) });
      if (!c.ok) {
        say(`FAIL ${id} ${el.dataset.name}${el.dataset.bug ? ` (TraceJVM bug ${el.dataset.bug})` : ""}\n   does not compile: ${c.stderr.split("\n").slice(0, 4).join(" | ")}`);
        results.push([id, false]); continue;
      }
      const lines = el.dataset.input != null ? el.dataset.input.split("|") : [];
      const files = Object.fromEntries(Object.entries(el.dataset.files ? JSON.parse(el.dataset.files) : {}).map(([k, v]) => [k, enc.encode(v)]));
      let stdout = "", stderr = "";
      const r = await java.run(c.program, { files, onOut: (t) => { stdout += t; }, onErr: (t) => { stderr += t; },
        readLine: () => new Promise((res) => setTimeout(() => res(lines.length ? lines.shift() : null), 5)), timeLimitMs: 20000 });
      const code = +(el.dataset.code || 0), errStart = el.dataset.err || "";
      const ok = stdout === expect && r.code === code && stderr.startsWith(errStart) && (errStart || !stderr);
      results.push([id, ok]);
      say(`${ok ? "PASS" : "FAIL"} ${id} ${el.dataset.name}${!ok && el.dataset.bug ? ` (TraceJVM bug ${el.dataset.bug})` : ""}  [compile ${c.ms} ms, run ${r.ms} ms]`);
      if (!ok) {
        const g = stdout.split("\n"), e = expect.split("\n");
        for (let i = 0; i < Math.max(g.length, e.length); i++) if (g[i] !== e[i]) say(`   line ${i + 1}\n     JDK  ${JSON.stringify(e[i])}\n     here ${JSON.stringify(g[i])}`);
        if (r.code !== code) say(`   exit code ${r.code} (JDK: ${code}) ${r.error || ""}`);
        if (!stderr.startsWith(errStart) || (!errStart && stderr)) say(`   stderr ${JSON.stringify(stderr.slice(0, 700))}`);
      }
    }
  } catch (e) {
    say(`FAIL ${e && `${e.name}: ${e.message}${e.cause ? ` (cause: ${e.cause.message || e.cause})` : ""}\n${e.stack || ""}` || e}`);
  }
  const passed = results.filter(([, ok]) => ok).length;
  say(`INFO ${passed} of ${results.length} rows pass; failing: ${results.filter(([, ok]) => !ok).map(([id]) => id).join(", ") || "none"}`);
  say("DONE");
</script></body></html>
