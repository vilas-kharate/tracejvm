<!-- P7b: does javac (TeaVM) write the -0.0 constant? CONSTANT_Double is tag 6 + 8 bytes; -0.0 is 80 00 .. 00. -->
<script type="text/x-java" data-id="P7b" data-name="bug 7: is the -0.0 constant in the class file javac wrote?">
public class Main {
    public static void main(String[] a) throws Exception {
        double v = -0.0;
        try (var in = Main.class.getResourceAsStream("Main.class")) {
            if (in == null) { System.out.println("no class file to read"); return; }
            byte[] b = in.readAllBytes();
            boolean found = false;
            for (int i = 0; i + 8 < b.length && !found; i++) {
                if (b[i] != 6 || b[i + 1] != (byte) 0x80) continue;
                boolean zeros = true;
                for (int k = 2; k <= 8; k++) zeros &= b[i + k] == 0;
                found = zeros;
            }
            System.out.println("-0.0 in the constant pool: " + found);
        }
        System.out.println(1.0 / v);
    }
}
</script>

import java.util.*;
import java.util.concurrent.*;
public class Main {
    public static void main(String[] a) throws Exception {
        ExecutorService pool = Executors.newFixedThreadPool(3);
        List<Future<Integer>> fs = new ArrayList<>();

<script type="text/x-java" data-id="P12e" data-name="bug 12: latch, barrier, semaphore, blocking queue">
import java.util.concurrent.*;
public class Main {
    public static void main(String[] a) throws Exception {
        CountDownLatch latch = new CountDownLatch(3);
        for (int i = 0; i < 3; i++) new Thread(latch::countDown).start();
        latch.await();
        System.out.println("latch " + latch.getCount());
        CyclicBarrier barrier = new CyclicBarrier(2, () -> System.out.println("barrier tripped"));
        Thread bt = new Thread(() -> { try { barrier.await(); } catch (Exception e) {} });
        bt.start(); barrier.await(); bt.join();
        Semaphore sem = new Semaphore(2); sem.acquire();
        System.out.println("permits " + sem.availablePermits());
        BlockingQueue<Integer> q = new LinkedBlockingQueue<>();
        Thread prod = new Thread(() -> { for (int i = 1; i <= 3; i++) q.add(i); q.add(-1); });
        prod.start();
        int got = 0, v;
        while ((v = q.take()) != -1) got += v;
        System.out.println("queue " + got);
    }
}
</script>

<!-- P12k: P12a (untimed get straight after submit; P12g-j wait with timeouts and pass) with a watchdog that, if the
     program is still running after 3 s, prints the futures, the pool and where every thread is. -->
<script type="text/x-java" data-id="P12k" data-name="bug 12: P12a with a watchdog that shows where each thread waits">
import java.util.*;
import java.util.concurrent.*;
public class Main {
    public static void main(String[] a) throws Exception {
        ExecutorService pool = Executors.newFixedThreadPool(3);
        List<Future<Integer>> fs = new ArrayList<>();
        for (int i = 1; i <= 5; i++) { int k = i; fs.add(pool.submit(() -> k * k)); }
        Thread dog = new Thread(() -> {
            try { Thread.sleep(3000); } catch (InterruptedException e) { return; }
            StringBuilder sb = new StringBuilder("WATCHDOG futures:");
            for (Future<Integer> f : fs) sb.append(' ').append(f.state());
            sb.append("\nWATCHDOG ").append(pool);
            try {
                for (Map.Entry<Thread, StackTraceElement[]> e : Thread.getAllStackTraces().entrySet()) {
                    sb.append("\nWATCHDOG thread ").append(e.getKey().getName()).append(' ').append(e.getKey().getState());
                    StackTraceElement[] st = e.getValue();
                    for (int i = 0; i < Math.min(6, st.length); i++) sb.append("\n    at ").append(st[i]);
                }
            } catch (Throwable t) { sb.append("\nWATCHDOG no thread dump: ").append(t); }
            System.out.println(sb);
        });
        dog.setDaemon(true);
        dog.start();
        int sum = 0;
        for (Future<Integer> f : fs) sum += f.get();
        System.out.println(sum);
        pool.shutdown();
        System.out.println(pool.awaitTermination(2, TimeUnit.SECONDS));
    }
}
</script>

<!-- P12g-j: where the fixed pool (P12a) stops. Each get has a 3 s timeout; on a timeout the line shows the task
     counters and the pool's own state, so the report says how far it got (a real JDK prints only the "got" lines). -->
<script type="text/x-java" data-id="P12g" data-name="bug 12: fixed pool of 3, five tasks, progress">
import java.util.*;
import java.util.concurrent.*;
import java.util.concurrent.atomic.*;
public class Main {
    public static void main(String[] a) throws Exception {
        ExecutorService pool = Executors.newFixedThreadPool(3);
        AtomicInteger started = new AtomicInteger(), done = new AtomicInteger();
        List<Future<Integer>> fs = new ArrayList<>();
        for (int i = 1; i <= 5; i++) { int k = i; fs.add(pool.submit(() -> { started.incrementAndGet(); int r = k * k; done.incrementAndGet(); return r; })); }
        System.out.println("submitted");
        for (int i = 0; i < 5; i++) {
            try { System.out.println("got " + fs.get(i).get(3, TimeUnit.SECONDS)); }
            catch (TimeoutException e) { System.out.println("timeout at " + (i + 1) + ": started " + started + ", done " + done + ", " + pool); }
        }
        pool.shutdownNow();
    }
}
</script>

<!-- P12l: the cause of P12a without a pool. The host runs two calls on the main thread per program (runCompiled, then
     takeLastIsolationReport) and the scheduler cleared the main thread's eetop when a call ended, so from the second
     program of a VM on, unpark(main) was dropped: an untimed park never woke and isAlive() said false. It must not be
     the first program of a VM (a crash or time-out before it starts a new one), so it comes after P12g-j, which pass. -->
<script type="text/x-java" data-id="P12l" data-name="bug 12: main thread parks without a timeout, another thread unparks it">
import java.util.concurrent.locks.LockSupport;
public class Main {
    public static void main(String[] a) throws Exception {
        Thread main = Thread.currentThread();
        System.out.println(main.isAlive());
        Thread t = new Thread(() -> {
            try { Thread.sleep(100); } catch (InterruptedException e) { return; }
            LockSupport.unpark(main);
        });
        t.start();
        LockSupport.park();
        System.out.println("woke");
        t.join();
    }
}
</script>

true
woke
</script>

<!-- P16a-b: java.util.zip. Deflater and Adler32 had no natives (UnsatisfiedLinkError: ZipOutputStream, GZIPOutputStream,
     the jar tool), Inflater lacked dictionaries, direct buffers and getAdler and reported a corrupt stream as finished.
     P16b prints compressed sizes, which depend on the zlib version (the JDK's and Emscripten's are both 1.3.1). -->
<script type="text/x-java" data-id="P16a" data-name="java.util.zip: checksums, Deflater / Inflater, GZIP, ZIP, errors, dictionaries, direct buffers">
import java.io.*;
import java.nio.ByteBuffer;
import java.nio.charset.StandardCharsets;
import java.util.*;
import java.util.zip.*;

public class Main {
    public static void main(String[] a) throws Exception {
        byte[] text = "to be or not to be, that is the question. ".repeat(40).getBytes(StandardCharsets.UTF_8);
        CRC32 crc = new CRC32();
        crc.update(text);
        crc.update(65);
        Adler32 adler = new Adler32();
        adler.update(text, 5, 100);
        adler.update(ByteBuffer.wrap(text));
        CRC32 direct = new CRC32();
        ByteBuffer d = ByteBuffer.allocateDirect(text.length).put(text).flip();
        direct.update(d);
        System.out.println("crc " + Long.toHexString(crc.getValue()) + " adler " + Long.toHexString(adler.getValue())
            + " direct " + Long.toHexString(direct.getValue()) + " crc32c " + Long.toHexString(crc32c(text)));

        Deflater def = new Deflater(Deflater.BEST_COMPRESSION);
        def.setInput(text);
        def.finish();
        byte[] buf = new byte[4096];
        int n = def.deflate(buf);
        System.out.println("deflate finished " + def.finished() + " in " + def.getBytesRead() + " smaller " + (n < text.length / 10));
        def.end();
        Inflater inf = new Inflater();
        inf.setInput(buf, 0, n);
        byte[] back = new byte[text.length];
        int m = inf.inflate(back);
        System.out.println("inflate " + m + " finished " + inf.finished() + " same " + Arrays.equals(back, text) + " remaining " + inf.getRemaining());
        inf.end();

        ByteArrayOutputStream gz = new ByteArrayOutputStream();
        try (GZIPOutputStream g = new GZIPOutputStream(gz)) { g.write(text); }
        try (GZIPInputStream g = new GZIPInputStream(new ByteArrayInputStream(gz.toByteArray()))) {
            System.out.println("gzip same " + Arrays.equals(g.readAllBytes(), text));
        }

        ByteArrayOutputStream zip = new ByteArrayOutputStream();
        try (ZipOutputStream z = new ZipOutputStream(zip)) {
            z.putNextEntry(new ZipEntry("a.txt"));
            z.write(text);
            z.closeEntry();
            ZipEntry stored = new ZipEntry("dir/b.bin");
            stored.setMethod(ZipEntry.STORED);
            stored.setSize(3);
            CRC32 c3 = new CRC32();
            c3.update(new byte[] { 1, 2, 3 });
            stored.setCrc(c3.getValue());
            z.putNextEntry(stored);
            z.write(new byte[] { 1, 2, 3 });
            z.closeEntry();
        }
        try (ZipInputStream z = new ZipInputStream(new ByteArrayInputStream(zip.toByteArray()))) {
            for (ZipEntry e; (e = z.getNextEntry()) != null; ) {
                byte[] data = z.readAllBytes();
                System.out.println("entry " + e.getName() + " " + data.length + " method " + e.getMethod());
            }
        }
        File f = new File("t.zip");
        try (FileOutputStream o = new FileOutputStream(f)) { o.write(zip.toByteArray()); }
        try (ZipFile zf = new ZipFile(f)) {
            System.out.println("zipfile " + zf.size() + " " + new String(zf.getInputStream(zf.getEntry("a.txt")).readAllBytes(), StandardCharsets.UTF_8).length());
        }

        try {
            Inflater bad = new Inflater();
            bad.setInput(new byte[] { 0x78, (byte) 0x9c, 1, 2, 3, 4, 5, 6, 7 });
            bad.inflate(new byte[100]);
            System.out.println("no error");
        } catch (DataFormatException e) {
            System.out.println("DataFormatException: " + e.getMessage());
        }

        byte[] dict = "the question".getBytes(StandardCharsets.UTF_8);
        Deflater dd = new Deflater();
        dd.setDictionary(dict);
        dd.setInput(text);
        dd.finish();
        int dn = dd.deflate(buf);
        Inflater di = new Inflater();
        di.setInput(buf, 0, dn);
        int first = di.inflate(back);
        System.out.println("needs dictionary " + di.needsDictionary() + " " + first + " adler " + Long.toHexString(di.getAdler()));
        di.setDictionary(dict);
        int got = di.inflate(back);
        System.out.println("with dictionary " + got + " same " + Arrays.equals(back, text));

        Deflater lv = new Deflater(Deflater.NO_COMPRESSION);
        ByteArrayOutputStream two = new ByteArrayOutputStream();
        lv.setInput(text, 0, 800);
        while (!lv.needsInput()) two.write(buf, 0, lv.deflate(buf, 0, buf.length, Deflater.NO_FLUSH));
        lv.setLevel(Deflater.BEST_SPEED);
        lv.setInput(text, 800, text.length - 800);
        lv.finish();
        while (!lv.finished()) two.write(buf, 0, lv.deflate(buf));
        Inflater li = new Inflater();
        li.setInput(two.toByteArray());
        byte[] all = new byte[text.length];
        int total = 0;
        while (!li.finished()) total += li.inflate(all, total, all.length - total);
        System.out.println("level change " + total + " same " + Arrays.equals(all, text));

        ByteArrayOutputStream raw = new ByteArrayOutputStream();
        try (DeflaterOutputStream o = new DeflaterOutputStream(raw, new Deflater(9, true), 64, true)) {
            o.write(text, 0, 100);
            o.flush();
            System.out.println("sync flush gave output " + (raw.size() > 0));
            o.write(text, 100, text.length - 100);
        }
        try (InflaterInputStream i = new InflaterInputStream(new ByteArrayInputStream(raw.toByteArray()), new Inflater(true))) {
            System.out.println("nowrap same " + Arrays.equals(i.readAllBytes(), text));
        }
        ByteBuffer src = ByteBuffer.allocateDirect(text.length).put(text).flip();
        ByteBuffer dst = ByteBuffer.allocateDirect(4096);
        Deflater bd = new Deflater();
        bd.setInput(src);
        bd.finish();
        bd.deflate(dst);
        dst.flip();
        Inflater bi = new Inflater();
        bi.setInput(dst);
        ByteBuffer out = ByteBuffer.allocateDirect(text.length);
        bi.inflate(out);
        out.flip();
        byte[] o2 = new byte[out.remaining()];
        out.get(o2);
        System.out.println("direct buffers same " + Arrays.equals(o2, text));
    }

    static long crc32c(byte[] b) {
        CRC32C c = new CRC32C();
        c.update(b);
        return c.getValue();
    }
}
</script>

<!-- P17: default method selection (JVMS 5.4.6). Any two different defaults for one method counted as ambiguous, so a
     class that extends AbstractCollection and implements List (javac's own List; jshell stopped on it) had no
     spliterator(): AbstractMethodError, although List's default is more specific than Collection's. -->
<script type="text/x-java" data-id="P17" data-name="default methods: the most specific one is selected">
import java.util.*;
import java.util.function.*;

public class Main {
    // As javac's own List: extends AbstractCollection and implements List, so spliterator() has three defaults
    // (Iterable, Collection, List) and List's is the most specific.
    static class Chain<A> extends AbstractCollection<A> implements List<A> {
        private final List<A> items;
        Chain(List<A> items) { this.items = items; }
        public Iterator<A> iterator() { return items.iterator(); }
        public int size() { return items.size(); }
        public A get(int i) { return items.get(i); }
        public A set(int i, A a) { throw new UnsupportedOperationException(); }
        public void add(int i, A a) { throw new UnsupportedOperationException(); }
        public A remove(int i) { throw new UnsupportedOperationException(); }
        public int indexOf(Object o) { return items.indexOf(o); }
        public int lastIndexOf(Object o) { return items.lastIndexOf(o); }
        public ListIterator<A> listIterator() { return items.listIterator(); }
        public ListIterator<A> listIterator(int i) { return items.listIterator(i); }
        public List<A> subList(int a, int b) { return items.subList(a, b); }
        public boolean addAll(int i, Collection<? extends A> c) { throw new UnsupportedOperationException(); }
    }

    static class Squares extends AbstractList<Integer> {
        public Integer get(int i) { return i * i; }
        public int size() { return 5; }
    }

    interface Named { default String name() { return "Named"; } }
    interface Titled extends Named { default String name() { return "Titled"; } }
    static class Book implements Named, Titled {}
    static class Novel extends Book implements Named {}

    public static void main(String[] a) {
        Chain<String> c = new Chain<>(List.of("x", "y", "z"));
        Iterable<String> it = c;
        System.out.println(it.spliterator().characteristics() + " " + ((Collection<String>) c).spliterator().characteristics() + " " + c.spliterator().characteristics());
        System.out.println(c.stream().map(String::toUpperCase).toList());
        Squares s = new Squares();
        System.out.println(s.stream().mapToInt(Integer::intValue).sum() + " " + ((Iterable<Integer>) s).spliterator().characteristics());
        System.out.println(new Book().name() + " " + new Novel().name() + " " + ((Named) new Novel()).name());
        List<String> sorted = new ArrayList<>(c);
        c.forEach(x -> sorted.add(x + "!"));
        System.out.println(sorted);
    }
}
</script>

<!-- P18: other threads' stack traces (Thread.dumpThreads and getStackTrace0 were missing: UnsatisfiedLinkError). Only
     what every JVM shows: the frames of a waiting thread below the program's own differ between implementations. -->
<script type="text/x-java" data-id="P18" data-name="threads: getAllStackTraces, another thread's getStackTrace">
import java.util.*;
import java.util.concurrent.CountDownLatch;

public class Main {
    static final CountDownLatch started = new CountDownLatch(1);

    static void work() {
        started.countDown();
        try { Thread.sleep(10_000); } catch (InterruptedException e) { System.out.println("worker interrupted"); }
    }

    public static void main(String[] a) throws Exception {
        Thread t = new Thread(Main::work, "worker");
        t.start();
        started.await();
        Thread.sleep(100);
        Map<Thread, StackTraceElement[]> all = Thread.getAllStackTraces();
        System.out.println(all.containsKey(Thread.currentThread()) + " " + all.containsKey(t));
        System.out.println(Arrays.stream(all.get(Thread.currentThread())).anyMatch(e -> e.getClassName().equals("Main") && e.getMethodName().equals("main")));
        System.out.println(Arrays.stream(t.getStackTrace()).anyMatch(e -> e.getClassName().equals("Main") && e.getMethodName().equals("work")));
        System.out.println(new Thread(() -> {}).getStackTrace().length + " " + t.getState());
        t.interrupt();
        t.join();
        System.out.println(t.getStackTrace().length);
    }
}
</script>

<!-- P19: Thread.getState(). Thread.holder.threadStatus stayed 0, so every thread was NEW (main too) and a second
     start() of a finished thread passed. -->
<script type="text/x-java" data-id="P19" data-name="threads: getState through every state, a second start">
import java.util.concurrent.locks.LockSupport;

public class Main {
    static final Object lock = new Object();

    static void await(Thread t, Thread.State s) throws InterruptedException {
        for (int i = 0; i < 300 && t.getState() != s; i++) Thread.sleep(10);
        System.out.println(t.getName() + " " + t.getState());
    }

    public static void main(String[] a) throws Exception {
        System.out.println("main " + Thread.currentThread().getState());
        Thread sleeper = new Thread(() -> { try { Thread.sleep(5000); } catch (InterruptedException e) { } }, "sleeper");
        System.out.println("sleeper " + sleeper.getState());
        sleeper.start();
        await(sleeper, Thread.State.TIMED_WAITING);
        Thread waiter = new Thread(() -> { synchronized (lock) { try { lock.wait(); } catch (InterruptedException e) { } } }, "waiter");
        waiter.start();
        await(waiter, Thread.State.WAITING);
        Thread parker = new Thread(LockSupport::park, "parker");
        parker.start();
        await(parker, Thread.State.WAITING);
        Thread blocked;
        synchronized (lock) {
            blocked = new Thread(() -> { synchronized (lock) { } }, "blocked");
            blocked.start();
            await(blocked, Thread.State.BLOCKED);
        }
        blocked.join();
        System.out.println("blocked " + blocked.getState());
        sleeper.interrupt();
        waiter.interrupt();
        LockSupport.unpark(parker);
        sleeper.join();
        waiter.join();
        parker.join();
        System.out.println(sleeper.getState() + " " + waiter.getState() + " " + parker.getState());
        try { sleeper.start(); } catch (IllegalThreadStateException e) { System.out.println("second start: " + e.getClass().getSimpleName()); }
    }
}
</script>

import java.io.*;
import java.net.*;
public class Main {
    public static void main(String[] args) throws Exception {
        try (ServerSocket server = new ServerSocket(0)) {
            int port = server.getLocalPort();
            Thread client = new Thread(() -> { try (Socket s = new Socket("localhost", port); PrintWriter out = new PrintWriter(s.getOutputStream(), true); BufferedReader in = new BufferedReader(new InputStreamReader(s.getInputStream()))) { out.println("ping"); System.out.println("client got " + in.readLine()); } catch (IOException e) { System.out.println("client " + e); } });
            client.start();
            try (Socket c = server.accept(); BufferedReader in = new BufferedReader(new InputStreamReader(c.getInputStream())); PrintWriter out = new PrintWriter(c.getOutputStream(), true)) { System.out.println("server got " + in.readLine()); out.println("pong"); }
            client.join();
        }
        try { new Socket("localhost", 1); } catch (ConnectException e) { System.out.println("refused"); }
    }
}
</script>

<script type="module">
  import { createJava } from "./java-engine.js";
  const out = document.getElementById("out");
  const say = (s) => { out.textContent += s + "\n"; };
  const only = new URLSearchParams(location.search).get("only");
  const want = only ? new Set(only.split(",")) : null;
  // ?rt=<folder under vendor/> runs the checks on another runtime build (e.g. tracejvm-fork-3/runtime); default 0.4.1.
  const rt = new URLSearchParams(location.search).get("rt") || "tracejvm-0.4.1/runtime";
  const BASE = new URL(`./vendor/${rt}/`, location.href).href;
  const enc = new TextEncoder();
  const text = (el) => (el ? el.textContent.replace(/^\n/, "") : "");
  const results = [];
  try {
    const java = createJava({ base: BASE });
    const t0 = performance.now();
    await java.ready;
    say(`INFO engine ready ${Math.round(performance.now() - t0)} ms`);
    for (const el of document.querySelectorAll('script[type="text/x-java"]')) {
      const id = el.dataset.id;
      if (want && !want.has(id)) continue;
      const expect = text(document.querySelector(`script[data-out="${id}"]`));
      const c = await java.compile({ "Main.java": text(el) });
      if (!c.ok) {
        say(`FAIL ${id} ${el.dataset.name}${el.dataset.bug ? ` (TraceJVM bug ${el.dataset.bug})` : ""}\n   does not compile: ${c.stderr.split("\n").slice(0, 4).join(" | ")}`);
        results.push([id, false]); continue;
      }
      const lines = el.dataset.input != null ? el.dataset.input.split("|") : [];
      const files = Object.fromEntries(Object.entries(el.dataset.files ? JSON.parse(el.dataset.files) : {}).map(([k, v]) => [k, enc.encode(v)]));
      let stdout = "", stderr = "";
      const r = await java.run(c.program, { files, onOut: (t) => { stdout += t; }, onErr: (t) => { stderr += t; },
        readLine: () => new Promise((res) => setTimeout(() => res(lines.length ? lines.shift() : null), 5)), timeLimitMs: 20000 });
      const code = +(el.dataset.code || 0), errStart = el.dataset.err || "";
      const ok = stdout === expect && r.code === code && stderr.startsWith(errStart) && (errStart || !stderr);
      results.push([id, ok]);
      say(`${ok ? "PASS" : "FAIL"} ${id} ${el.dataset.name}${!ok && el.dataset.bug ? ` (TraceJVM bug ${el.dataset.bug})` : ""}  [compile ${c.ms} ms, run ${r.ms} ms]`);
      if (!ok) {
        const g = stdout.split("\n"), e = expect.split("\n");
        for (let i = 0; i < Math.max(g.length, e.length); i++) if (g[i] !== e[i]) say(`   line ${i + 1}\n     JDK  ${JSON.stringify(e[i])}\n     here ${JSON.stringify(g[i])}`);
        if (r.code !== code) say(`   exit code ${r.code} (JDK: ${code}) ${r.error || ""}`);
        if (!stderr.startsWith(errStart) || (!errStart && stderr)) say(`   stderr ${JSON.stringify(stderr.slice(0, 700))}`);
      }
    }
  } catch (e) {
    say(`FAIL ${e && `${e.name}: ${e.message}${e.cause ? ` (cause: ${e.cause.message || e.cause})` : ""}\n${e.stack || ""}` || e}`);
  }
  const passed = results.filter(([, ok]) => ok).length;
  say(`INFO ${passed} of ${results.length} rows pass; failing: ${results.filter(([, ok]) => !ok).map(([id]) => id).join(", ") || "none"}`);
  say("DONE");
</script></body></html>
