<script type="text/x-java" data-id="A6" data-name="Control flow: fall-through switch, switch expressions, pattern switch, loops, labels">
public class Main {
    record Rect(double w, double h) {}
    static String describe(Object o) {
        return switch (o) {
            case null -> "null!";
            case Integer n when n > 100 -> "big int " + n;
            case Integer n -> "int " + n;
            case String s -> "text of " + s.length();
            case Rect(double w, double h) when w == h -> "square " + w;
            case Rect(var w, var h) -> "rect " + w + "x" + h;
            default -> "other " + o.getClass().getSimpleName();
        };
    }
    public static void main(String[] args) {
        int day = 3;
        switch (day) { case 1: System.out.print("one"); case 3: System.out.print("three"); case 4: System.out.print(",four"); break; default: System.out.print("other"); }
        System.out.println();
        String kind = switch (day) { case 1, 7 -> "weekend"; case 2, 3, 4, 5, 6 -> { String t = "week"; yield t + "day"; } default -> throw new IllegalStateException(); };
        System.out.println(kind);
        for (Object o : new Object[] {7, 500, "hello", new Rect(2, 2), new Rect(2, 3), 4.5, null}) System.out.println(describe(o));
        int i = 0; while (i < 3) i++; do { i += 10; } while (i < 5);
        System.out.println(i);
        outer:
        for (int r = 0; r < 3; r++) { for (int c = 0; c < 3; c++) { if (c == 2) continue outer; if (r == 2) break outer; System.out.print(r + "" + c + ";"); } }
        System.out.println();
        int sum = 0; for (int k = 10; k > 0; k -= 3) sum += k; System.out.println(sum);
    }
}
</script>

import java.util.*;
public class Main {
    static void change(int x, int[] arr, StringBuilder sb, List<String> list) { x = 99; arr[0] = 99; sb.append("!"); list = new ArrayList<>(); list.add("new"); }
    static int add(int a, int b) { return a + b; }
    static double add(double a, double b) { return a + b + 0.5; }
    static String add(String a, int b) { return a + b; }
    static long fact(int n) { return n <= 1 ? 1 : n * fact(n - 1); }
    static int fib(int n) { return n < 2 ? n : fib(n - 1) + fib(n - 2); }
    int counter = 0; void inc() { counter++; }
    public static void main(String[] args) {
        int x = 1; int[] arr = {1}; StringBuilder sb = new StringBuilder("hi"); List<String> list = new ArrayList<>(List.of("old"));

        Main m = new Main(); m.inc(); m.inc(); System.out.println(m.counter);

public class Main {
    static class Account {
        private static int created = 0;
        static { System.out.println("static block"); }
        private final String owner; private double balance;
        { System.out.println("instance block"); }
        Account(String owner) { this(owner, 0); System.out.println("1-arg constructor"); }
        Account(String owner, double balance) { this.owner = owner; this.balance = balance; created++; System.out.println("2-arg constructor"); }
        void deposit(double amt) { if (amt <= 0) throw new IllegalArgumentException("amount must be positive"); balance += amt; }
        double getBalance() { return balance; }
        @Override public String toString() { return owner + ": " + balance; }
        @Override public boolean equals(Object o) { return o instanceof Account acc && acc.owner.equals(owner); }
        @Override public int hashCode() { return owner.hashCode(); }
    }
    public static void main(String[] args) {
        System.out.println("main starts");
        Account a = new Account("Asha");
        a.deposit(100);
        Account b = new Account("Asha", 5);
        System.out.println(a + " | " + b.getBalance() + " | " + a.equals(b) + " " + (a == b) + " " + (a.hashCode() == b.hashCode()) + " " + Account.created);
        try { a.deposit(-1); } catch (IllegalArgumentException e) { System.out.println(e.getMessage()); }
        System.out.println(new java.util.HashSet<>(java.util.List.of(a, b)).size());

<script type="text/x-java" data-id="A11" data-name="Inheritance: abstract, super, overriding, polymorphism, casts, field hiding">
import java.util.*;
public class Main {
    static abstract class Animal {
        protected String name; String kind = "animal";
        Animal(String name) { this.name = name; }
        abstract String sound();
        String describe() { return name + " says " + sound(); }
        Animal self() { return this; }
    }
    static class Dog extends Animal {
        String kind = "dog";
        Dog(String n) { super(n); }
        @Override String sound() { return "Woof"; }
        @Override Dog self() { return this; }
        void fetch() { System.out.println(name + " fetches"); }
    }
    static class Puppy extends Dog {
        Puppy(String n) { super(n); }
        @Override String sound() { return super.sound() + " (tiny)"; }
    }
    static class Cat extends Animal {
        Cat(String n) { super(n); }
        String sound() { return "Meow"; }
    }
    public static void main(String[] args) {
        List<Animal> zoo = List.of(new Dog("Rex"), new Cat("Tom"), new Puppy("Bit"));
        for (Animal a : zoo) System.out.println(a.describe());
        Animal a = zoo.get(0);
        System.out.println(a.kind + " " + ((Dog) a).kind + " " + (a instanceof Dog) + " " + (a instanceof Puppy) + " " + a.self().getClass().getSimpleName());
        if (a instanceof Dog d) d.fetch();
        try { Cat c = (Cat) a; } catch (ClassCastException e) { System.out.println("ClassCastException"); }
        Object o = new Puppy("P"); System.out.println(o instanceof Animal an ? an.getClass().getSuperclass().getSimpleName() : "no");
    }
}

<script type="text/x-java" data-id="A12" data-name="Interfaces: default, private, static methods; sealed and non-sealed">
public class Main {
    interface Greeter { String name(); default String greet() { return "Hello, " + decorate(name()); } private String decorate(String s) { return "*" + s + "*"; } static Greeter of(String n) { return () -> n; } }
    interface Loud { default String shout() { return "HEY"; } }
    static class Person implements Greeter, Loud, Comparable<Person> { final String n; Person(String n) { this.n = n; } public String name() { return n; } public int compareTo(Person o) { return n.compareTo(o.n); } }
    sealed interface Vehicle permits Car, Bike {}
    static final class Car implements Vehicle {}
    static non-sealed class Bike implements Vehicle {}
    static class EBike extends Bike {}
    @FunctionalInterface interface Op { int apply(int a, int b); }
    public static void main(String[] args) {
        Person p = new Person("Mira");
        System.out.println(p.greet() + " " + p.shout() + " " + Greeter.of("Zed").greet());
        Op add = (a, b) -> a + b, mul = (a, b) -> a * b;
        System.out.println(add.apply(3, 4) + " " + mul.apply(3, 4));
        Vehicle v = new EBike();
        String kind = switch (v) { case Car c -> "car"; case Bike b -> "bike " + b.getClass().getSimpleName(); };
        System.out.println(kind + " " + new Person("A").compareTo(new Person("B")));
    }
}

        class Local { String hi(String n) { return "hi " + n; } }

        names.sort(new Comparator<String>() { public int compare(String a, String b) { return Integer.compare(a.length(), b.length()); } });

<script type="text/x-java" data-id="A14" data-name="Enums: fields, constant bodies, EnumSet / EnumMap, valueOf">
import java.util.*;
public class Main {
    enum Planet {
        MERCURY(3.303e+23, 2.4397e6), EARTH(5.976e+24, 6.37814e6);
        private final double mass, radius;
        Planet(double mass, double radius) { this.mass = mass; this.radius = radius; }
        double gravity() { return 6.67300E-11 * mass / (radius * radius); }
    }
    enum Op {
        PLUS("+") { int apply(int a, int b) { return a + b; } },
        TIMES("*") { int apply(int a, int b) { return a * b; } };
        final String sym; Op(String s) { sym = s; } abstract int apply(int a, int b);
    }
    enum Day { MON, TUE, WED, THU, FRI, SAT, SUN }
    public static void main(String[] args) {
        for (Planet p : Planet.values()) System.out.printf("%s %d %.2f%n", p, p.ordinal(), p.gravity());
        for (Op o : Op.values()) System.out.println(o.name() + " " + o.sym + " " + o.apply(6, 7));
        Day d = Day.valueOf("SAT");
        String w = switch (d) { case SAT, SUN -> "weekend"; default -> "weekday"; };

        EnumMap<Day, Integer> hours = new EnumMap<>(Day.class); hours.put(Day.WED, 8); hours.put(Day.MON, 6); System.out.println(hours);
        try { Day.valueOf("XYZ"); } catch (IllegalArgumentException e) { System.out.println(e.getMessage()); }
    }
}

<script type="text/x-java" data-id="A15" data-name="Records: compact constructors, record patterns, generic records">
import java.util.*;
public class Main {
    record Point(int x, int y) {
        static final Point ORIGIN = new Point(0, 0);
        Point { if (x < 0) throw new IllegalArgumentException("x < 0: " + x); }
        Point(int v) { this(v, v); }
        double dist() { return Math.sqrt(x * x + y * y); }
        static Point of(String s) { String[] p = s.split(","); return new Point(Integer.parseInt(p[0]), Integer.parseInt(p[1])); }
    }
    record Line(Point from, Point to) {}
    record Pair<A, B>(A first, B second) implements Comparable<Pair<A, B>> { public int compareTo(Pair<A, B> o) { return first.toString().compareTo(o.first.toString()); } }
    public static void main(String[] args) {
        Point p = new Point(3, 4);
        System.out.println(p + " " + p.x() + " " + p.dist() + " " + p.equals(Point.of("3,4")) + " " + new Point(7) + " " + Point.ORIGIN);
        Object o = new Line(p, new Point(5));
        if (o instanceof Line(Point(var x1, var y1), Point to) && x1 < to.x()) System.out.println("from " + x1 + "," + y1 + " to " + to);
        try { new Point(-1, 0); } catch (IllegalArgumentException e) { System.out.println(e.getMessage()); }
        Set<Point> set = new HashSet<>(); set.add(new Point(1, 1)); set.add(new Point(1, 1)); set.add(new Point(2, 2));
        System.out.println(set.size() + " " + new Pair<>("b", 1).compareTo(new Pair<>("a", 2)) + " " + new Pair<>("k", List.of(1)));
    }
}
</script>

import java.util.*;
public class Main {
    static class Box<T extends Comparable<T>> { private T v; Box(T v) { this.v = v; } T get() { return v; } boolean bigger(Box<T> o) { return v.compareTo(o.v) > 0; } }
    static <T> void swap(T[] a, int i, int j) { T t = a[i]; a[i] = a[j]; a[j] = t; }
    static double sum(List<? extends Number> nums) { double s = 0; for (Number n : nums) s += n.doubleValue(); return s; }
    static void fill(List<? super Integer> out) { out.add(1); out.add(2); }
    static <K, V extends Comparable<V>> K argMax(Map<K, V> m) { K best = null; V bv = null; for (var e : m.entrySet()) if (bv == null || e.getValue().compareTo(bv) > 0) { best = e.getKey(); bv = e.getValue(); } return best; }
    interface Transformer<A, B> { B apply(A a); default <C> Transformer<A, C> then(Transformer<B, C> next) { return a -> next.apply(apply(a)); } }
    public static void main(String[] args) {
        System.out.println(new Box<>(5).bigger(new Box<>(3)) + " " + new Box<>("pear").get());
        String[] s = {"a", "b", "c"}; swap(s, 0, 2); System.out.println(String.join("", s));
        List<Object> sink = new ArrayList<>(); fill(sink);
        System.out.println(sum(List.of(1, 2.5, 3L)) + " " + sink + " " + argMax(Map.of("x", 3, "y", 9, "z", 5)));
        Transformer<String, Integer> len = String::length;
        System.out.println(len.then(n -> n * n).apply("four"));
        List<String> raw = new ArrayList<>(); Object o = raw; System.out.println(o instanceof List<?> l ? "list of " + l.size() : "no");
    }
}
</script>

<script type="text/x-java" data-id="A17" data-name="Exceptions: custom, finally, multi-catch, try-with-resources + suppressed, causes, assert, CME">
import java.io.*;
public class Main {
    static class InsufficientFundsException extends Exception { final double shortBy; InsufficientFundsException(double s) { super("short by " + s); shortBy = s; } }
    static class Res implements AutoCloseable { final String n; Res(String n) { this.n = n; System.out.println("open " + n); } public void close() throws Exception { System.out.println("close " + n); if (n.equals("B")) throw new IOException("close failed " + n); } }
    static void withdraw(double bal, double amt) throws InsufficientFundsException { if (amt > bal) throw new InsufficientFundsException(amt - bal); }
    static int tricky() { try { return 1; } finally { System.out.println("finally before return"); } }
    public static void main(String[] args) throws Exception {
        try { withdraw(50, 80); } catch (InsufficientFundsException e) { System.out.println(e.getMessage() + " " + e.shortBy); } finally { System.out.println("finally"); }
        try { Object o = null; o.toString(); } catch (NullPointerException | ArithmeticException e) { System.out.println("multi-catch " + e.getClass().getSimpleName()); }
        try (Res a = new Res("A"); Res b = new Res("B")) { System.out.println("body"); throw new IllegalStateException("body failed"); }
        catch (IllegalStateException e) { System.out.println(e.getMessage() + ", suppressed: " + e.getSuppressed().length + " " + e.getSuppressed()[0].getMessage()); }
        System.out.println(tricky());
        try { try { Integer.parseInt("x"); } catch (NumberFormatException e) { throw new RuntimeException("wrapped", e); } }
        catch (RuntimeException e) { System.out.println(e.getMessage() + " <- " + e.getCause().getClass().getName()); }
        try { int[] a = new int[2]; a[2] = 1; } catch (RuntimeException e) { System.out.println(e); }
        try { throw new Error("custom error"); } catch (Throwable t) { System.out.println(t instanceof Exception); }
        try { assert 1 > 2 : "assertions are on"; System.out.println("assertions are off"); } catch (AssertionError e) { System.out.println(e.getMessage()); }
        try { java.util.List.of(1).add(2); } catch (UnsupportedOperationException e) { System.out.println("immutable: " + e.getMessage()); }
        try { var l = new java.util.ArrayList<>(java.util.List.of(1, 2, 3)); for (Integer x : l) if (x == 1) l.remove(x); } catch (java.util.ConcurrentModificationException e) { System.out.println("CME " + e.getMessage()); }
    }
}
</script>

<script type="text/x-java" data-id="A19" data-name="Annotations: custom, retention, reading them by reflection">
import java.lang.annotation.*;
import java.lang.reflect.*;
import java.util.*;
public class Main {
    @Retention(RetentionPolicy.RUNTIME) @Target(ElementType.METHOD) @interface Test { String value() default "unnamed"; int times() default 1; }
    @Retention(RetentionPolicy.RUNTIME) @interface Info { String author(); }
    @Info(author = "Ravi") static class Suite {
        @Test("adds") public void a() {}
        @Test(value = "multiplies", times = 3) public void b() {}
        public void helper() {}
        @Deprecated public void old() {}
    }
    @SafeVarargs static <T> List<T> listOf(T... xs) { return Arrays.asList(xs); }
    @SuppressWarnings("unchecked") public static void main(String[] args) {
        List<String> names = new ArrayList<>();
        for (Method m : Suite.class.getDeclaredMethods()) { Test t = m.getAnnotation(Test.class); if (t != null) names.add(m.getName() + ":" + t.value() + "x" + t.times()); }
        Collections.sort(names);
        System.out.println(names + " " + Suite.class.getAnnotation(Info.class).author() + " " + listOf(1, 2));
        try { System.out.println(Suite.class.getMethod("old").isAnnotationPresent(Deprecated.class)); } catch (NoSuchMethodException e) { System.out.println(e); }
    }
}

        Set<String> hs = new HashSet<>(List.of("pear", "apple", "fig", "apple")); Set<String> lhs = new LinkedHashSet<>(List.of("pear", "apple", "fig")); TreeSet<String> ts = new TreeSet<>(hs);

        Map<String, Integer> hm = new HashMap<>(); for (String w : "the cat and the hat and the bat".split(" ")) hm.merge(w, 1, Integer::sum);
        Map<String, Integer> tm = new TreeMap<>(hm); Map<String, Integer> lhm = new LinkedHashMap<>(); lhm.put("z", 1); lhm.put("a", 2); lhm.putIfAbsent("z", 9);

<script type="text/x-java" data-id="B3" data-name="Streams: collectors, groupingBy, partitioningBy, teeing, primitive and parallel streams">
import java.util.*;
import java.util.stream.*;
public class Main {
    record Emp(String name, String dept, double pay) {}
    public static void main(String[] args) {
        List<Emp> emps = List.of(new Emp("Asha", "IT", 900), new Emp("Ben", "HR", 500), new Emp("Chen", "IT", 1200), new Emp("Dia", "Ops", 700), new Emp("Eli", "HR", 650));
        System.out.println(emps.stream().filter(e -> e.pay() > 600).map(Emp::name).sorted(Comparator.reverseOrder()).collect(Collectors.joining(", ", "[", "]")));
        Map<String, List<String>> byDept = emps.stream().collect(Collectors.groupingBy(Emp::dept, TreeMap::new, Collectors.mapping(Emp::name, Collectors.toList())));
        System.out.println(byDept);
        Map<Boolean, Long> rich = emps.stream().collect(Collectors.partitioningBy(e -> e.pay() >= 700, Collectors.counting()));
        System.out.println(rich + " " + emps.stream().mapToDouble(Emp::pay).average().getAsDouble() + " " + emps.stream().collect(Collectors.summingDouble(Emp::pay)));
        DoubleSummaryStatistics st = emps.stream().mapToDouble(Emp::pay).summaryStatistics();
        System.out.println(st.getMin() + " " + st.getMax() + " " + st.getCount() + " " + emps.stream().max(Comparator.comparingDouble(Emp::pay)).map(Emp::name).orElse("-"));
        System.out.println(Stream.of("a,b", "c", "d,e,f").flatMap(s -> Arrays.stream(s.split(","))).collect(Collectors.toList()) + " " + IntStream.rangeClosed(1, 5).boxed().collect(Collectors.toMap(i -> i, i -> i * i)));
        System.out.println(Stream.iterate(1, x -> x <= 100, x -> x * 3).toList() + " " + Stream.generate(() -> "z").limit(3).collect(Collectors.joining()) + " " + IntStream.of(3, 1, 3, 2, 1).distinct().sorted().boxed().toList());
        System.out.println(IntStream.range(0, 10).skip(2).limit(5).sum() + " " + Stream.of(1, 2, 3, 4, 5, 1).takeWhile(x -> x < 4).toList() + " " + Stream.of(1, 2, 3, 4, 1).dropWhile(x -> x < 3).toList() + " " + Stream.of(5, 3, 8).reduce(0, Integer::sum) + " " + Stream.of("x").findFirst().get());
        System.out.println(emps.stream().anyMatch(e -> e.dept().equals("Ops")) + " " + emps.stream().allMatch(e -> e.pay() > 400) + " " + emps.stream().noneMatch(e -> e.pay() > 2000) + " " + emps.stream().count() + " " + Arrays.toString(Stream.of(3, 1).sorted().toArray()));
        String team = emps.stream().collect(Collectors.teeing(Collectors.counting(), Collectors.averagingDouble(Emp::pay), (n, avg) -> n + " people, avg " + avg));
        System.out.println(team);
        System.out.println(IntStream.rangeClosed(1, 2000).parallel().filter(i -> i % 7 == 0).count() + " " + List.of(4, 5, 6).parallelStream().map(x -> x * 2).collect(Collectors.toList()));
        List<String> seen = new ArrayList<>(); Stream.of("p", "q").peek(seen::add).map(String::toUpperCase).forEach(System.out::print); System.out.println(" " + seen);
        System.out.println(Stream.of("bb", "a", "ccc").collect(Collectors.groupingBy(String::length)) + " " + Stream.of("x", "y", "x").collect(Collectors.toCollection(TreeSet::new)));
    }
}

<script type="text/x-java" data-id="B9" data-name="Concurrency: synchronized, executors, futures, CompletableFuture, latch, barrier, semaphore, queues, virtual threads">
import java.util.*;
import java.util.concurrent.*;
import java.util.concurrent.atomic.*;
public class Main {
    static int safeCount = 0;
    static synchronized void incSafe() { safeCount++; }
    static volatile boolean running = true;
    public static void main(String[] args) throws Exception {
        Thread[] ts = new Thread[4];
        for (int i = 0; i < 4; i++) { ts[i] = new Thread(() -> { for (int j = 0; j < 10000; j++) incSafe(); }, "w" + i); ts[i].start(); }
        for (Thread t : ts) t.join();
        System.out.println("synchronized: " + safeCount);
        AtomicLong al = new AtomicLong(); ExecutorService pool = Executors.newFixedThreadPool(3);
        List<Future<Integer>> fs = new ArrayList<>(); for (int i = 1; i <= 5; i++) { int k = i; fs.add(pool.submit(() -> { al.addAndGet(k); return k * k; })); }
        int sum = 0; for (Future<Integer> f : fs) sum += f.get(); pool.shutdown(); System.out.println(pool.awaitTermination(2, TimeUnit.SECONDS) + " " + sum + " " + al.get());
        List<Callable<String>> jobs = List.of(() -> "a", () -> "b"); ExecutorService p2 = Executors.newCachedThreadPool(); System.out.println(p2.invokeAll(jobs).stream().map(f -> { try { return f.get(); } catch (Exception e) { return "?"; } }).toList()); p2.shutdown();
        CompletableFuture<Integer> cf = CompletableFuture.supplyAsync(() -> 6).thenApplyAsync(x -> x * 7).thenCombine(CompletableFuture.completedFuture(1), Integer::sum);
        System.out.println(cf.get() + " " + CompletableFuture.supplyAsync(() -> { if (true) throw new IllegalStateException("boom"); return "x"; }).exceptionally(e -> e.getCause().getMessage()).join());
        CountDownLatch latch = new CountDownLatch(3); for (int i = 0; i < 3; i++) new Thread(latch::countDown).start(); latch.await(); System.out.println("latch " + latch.getCount());
        CyclicBarrier barrier = new CyclicBarrier(2, () -> System.out.println("barrier tripped")); Thread bt = new Thread(() -> { try { barrier.await(); } catch (Exception e) {} }); bt.start(); barrier.await(); bt.join();
        Semaphore sem = new Semaphore(2); sem.acquire(); System.out.println("permits " + sem.availablePermits() + " " + sem.tryAcquire() + " " + sem.tryAcquire());
        BlockingQueue<Integer> q = new LinkedBlockingQueue<>(); Thread prod = new Thread(() -> { for (int i = 1; i <= 3; i++) q.add(i); q.add(-1); }); prod.start(); int got = 0, v; while ((v = q.take()) != -1) got += v; System.out.println("queue " + got);
        ConcurrentHashMap<String, Integer> chm = new ConcurrentHashMap<>(); chm.merge("k", 1, Integer::sum); chm.computeIfAbsent("z", x -> 26); System.out.println(new TreeMap<>(chm) + " " + new CopyOnWriteArrayList<>(List.of(1, 2)));
        ThreadLocal<Integer> tl = ThreadLocal.withInitial(() -> 5); Thread tt = new Thread(() -> tl.set(9)); tt.start(); tt.join(); System.out.println("threadlocal " + tl.get());
        Thread sleeper = new Thread(() -> { try { Thread.sleep(10000); System.out.println("not here"); } catch (InterruptedException e) { System.out.println("interrupted"); } }); sleeper.start(); sleeper.interrupt(); sleeper.join();
        Thread d = new Thread(() -> {}); d.setDaemon(true); System.out.println("daemon " + d.isDaemon() + " " + Thread.currentThread().getName());
        Thread worker = new Thread(() -> { while (running) Thread.onSpinWait(); }); worker.start(); running = false; worker.join(); System.out.println("volatile stop");
        try (ExecutorService vt = Executors.newVirtualThreadPerTaskExecutor()) { List<Future<Integer>> vf = new ArrayList<>(); for (int i = 0; i < 100; i++) { int k = i; vf.add(vt.submit(() -> k)); } int s = 0; for (var f : vf) s += f.get(); System.out.println("virtual " + s); }
        Thread v1 = Thread.ofVirtual().start(() -> {}); v1.join(); System.out.println(v1.isVirtual());
        System.out.println(ForkJoinPool.commonPool().invoke(new RecursiveTask<Long>() { protected Long compute() { return 21L * 2; } }));
    }
}

<script type="text/x-java" data-id="B10" data-name="Reflection: Class.forName, constructors, fields, private methods, Proxy, records">
import java.lang.reflect.*;
import java.util.*;
public class Main {
    public static class Person { private String name = "Kim"; public int age = 30; public Person() {} public Person(String n) { name = n; } public String hello(String to) { return name + " greets " + to; } private int secret() { return 42; } }
    interface Greeter { String greet(String n); }
    record R(int a, String b) {}
    public static void main(String[] args) throws Exception {
        Class<?> c = Class.forName("Main$Person");
        System.out.println(c.getName() + " " + c.getSimpleName() + " " + c.getSuperclass().getSimpleName() + " " + Modifier.isPublic(c.getModifiers()) + " " + Modifier.isStatic(c.getModifiers()));
        Object p = c.getConstructor(String.class).newInstance("Lee");
        System.out.println(c.getMethod("hello", String.class).invoke(p, "you"));
        Field f = c.getDeclaredField("name"); f.setAccessible(true); f.set(p, "Max"); System.out.println(f.get(p) + " " + c.getField("age").getInt(p));
        Method s = c.getDeclaredMethod("secret"); s.setAccessible(true); System.out.println(s.invoke(p) + " " + Modifier.isPrivate(s.getModifiers()));
        List<String> ms = new ArrayList<>(); for (Method m : c.getDeclaredMethods()) ms.add(m.getName()); Collections.sort(ms); System.out.println(ms + " " + c.getDeclaredConstructors().length + " " + c.getDeclaredFields().length);
        Greeter g = (Greeter) Proxy.newProxyInstance(Main.class.getClassLoader(), new Class<?>[] {Greeter.class}, (proxy, method, a) -> method.getName() + "(" + a[0] + ")");
        System.out.println(g.greet("Zoe") + " " + int[].class.getName() + " " + String[].class.getSimpleName() + " " + int.class + " " + Integer.TYPE);
        System.out.println(Arrays.stream(R.class.getRecordComponents()).map(rc -> rc.getName() + ":" + rc.getType().getSimpleName()).toList() + " " + R.class.isRecord());
    }
}

import java.util.*;
public class Main {
    static class Range implements Iterable<Integer> { final int lo, hi; Range(int lo, int hi) { this.lo = lo; this.hi = hi; } public Iterator<Integer> iterator() { return new Iterator<>() { int c = lo; public boolean hasNext() { return c < hi; } public Integer next() { if (!hasNext()) throw new NoSuchElementException(); return c++; } }; } }
    static class Sheep implements Cloneable { String name; List<String> tags = new ArrayList<>(); Sheep(String n) { name = n; } @Override public Sheep clone() { try { return (Sheep) super.clone(); } catch (CloneNotSupportedException e) { throw new AssertionError(); } } }
    public static void main(String[] args) throws Exception {
        for (int i : new Range(1, 4)) System.out.print(i + ";"); System.out.println();
        Sheep a = new Sheep("Dolly"); a.tags.add("white"); Sheep b = a.clone(); b.name = "Molly"; b.tags.add("cloned");
        System.out.println(a.name + " " + a.tags + " " + b.name + " " + (a.tags == b.tags));
        System.out.println(Objects.equals(null, null) + " " + Objects.hash(1, 2, 3) + " " + Objects.requireNonNullElse(null, "dflt") + " " + Objects.toString(null, "-") + " " + Objects.isNull(a));
        try { Objects.requireNonNull(null, "name must not be null"); } catch (NullPointerException e) { System.out.println(e.getMessage()); }
        Optional<String> o = Optional.ofNullable(null); System.out.println(o.orElseGet(() -> "gen") + " " + Optional.of(5).filter(x -> x > 3).map(x -> x * 2).get() + " " + o.or(() -> Optional.of("alt")).get() + " " + Optional.of("v").stream().count());
        System.out.println(UUID.fromString("123e4567-e89b-12d3-a456-426614174000").version() + " " + UUID.randomUUID().toString().length() + " " + new String(Base64.getDecoder().decode("SmF2YQ==")) + " " + Base64.getUrlEncoder().withoutPadding().encodeToString(new byte[] {-5, -1}) + " " + HexFormat.of().withUpperCase().formatHex(new byte[] {(byte) 0xCA, (byte) 0xFE}));
        Properties props = new Properties(); props.load(new java.io.StringReader("host=localhost\nport = 8080\n# comment\n")); System.out.println(props.getProperty("port") + " " + props.getProperty("user", "guest") + " " + props.size());

<script type="text/x-java" data-id="B13b" data-name="Networking: a server and a client on localhost (needs our loopback emulation)">
import java.io.*;
import java.net.*;
public class Main {
    public static void main(String[] args) throws Exception {
        try (ServerSocket server = new ServerSocket(5050)) {
            Thread client = new Thread(() -> { try (Socket s = new Socket("localhost", 5050); PrintWriter out = new PrintWriter(s.getOutputStream(), true); BufferedReader in = new BufferedReader(new InputStreamReader(s.getInputStream()))) { out.println("ping"); System.out.println("client got " + in.readLine()); } catch (IOException e) { System.out.println("client " + e); } });
            client.start();
            try (Socket c = server.accept(); BufferedReader in = new BufferedReader(new InputStreamReader(c.getInputStream())); PrintWriter out = new PrintWriter(c.getOutputStream(), true)) { System.out.println("server got " + in.readLine()); out.println("pong"); }
            client.join();
        }
    }
}
</script>

<script type="module">
  import { createJava } from "./java-engine.js";
  const out = document.getElementById("out");
  const say = (s) => { out.textContent += s + "\n"; };
  const only = new URLSearchParams(location.search).get("only");
  const want = only ? new Set(only.split(",")) : null;
  // ?rt=<folder under vendor/> runs the checks on another runtime build (e.g. tracejvm-fork-3/runtime); default 0.4.1.
  const rt = new URLSearchParams(location.search).get("rt") || "tracejvm-0.4.1/runtime";
  const BASE = new URL(`./vendor/${rt}/`, location.href).href;
  const enc = new TextEncoder();
  const text = (el) => (el ? el.textContent.replace(/^\n/, "") : "");
  const results = [];
  try {
    const java = createJava({ base: BASE });
    const t0 = performance.now();
    await java.ready;
    say(`INFO engine ready ${Math.round(performance.now() - t0)} ms`);
    for (const el of document.querySelectorAll('script[type="text/x-java"]')) {
      const id = el.dataset.id;
      if (want && !want.has(id)) continue;
      const expect = text(document.querySelector(`script[data-out="${id}"]`));
      const c = await java.compile({ "Main.java": text(el) });
      if (!c.ok) {
        say(`FAIL ${id} ${el.dataset.name}${el.dataset.bug ? ` (TraceJVM bug ${el.dataset.bug})` : ""}\n   does not compile: ${c.stderr.split("\n").slice(0, 4).join(" | ")}`);
        results.push([id, false]); continue;
      }
      const lines = el.dataset.input != null ? el.dataset.input.split("|") : [];
      const files = Object.fromEntries(Object.entries(el.dataset.files ? JSON.parse(el.dataset.files) : {}).map(([k, v]) => [k, enc.encode(v)]));
      let stdout = "", stderr = "";
      const r = await java.run(c.program, { files, onOut: (t) => { stdout += t; }, onErr: (t) => { stderr += t; },
        readLine: () => new Promise((res) => setTimeout(() => res(lines.length ? lines.shift() : null), 5)), timeLimitMs: 20000 });
      const code = +(el.dataset.code || 0), errStart = el.dataset.err || "";
      const ok = stdout === expect && r.code === code && stderr.startsWith(errStart) && (errStart || !stderr);
      results.push([id, ok]);
      say(`${ok ? "PASS" : "FAIL"} ${id} ${el.dataset.name}${!ok && el.dataset.bug ? ` (TraceJVM bug ${el.dataset.bug})` : ""}  [compile ${c.ms} ms, run ${r.ms} ms]`);
      if (!ok) {
        const g = stdout.split("\n"), e = expect.split("\n");
        for (let i = 0; i < Math.max(g.length, e.length); i++) if (g[i] !== e[i]) say(`   line ${i + 1}\n     JDK  ${JSON.stringify(e[i])}\n     here ${JSON.stringify(g[i])}`);
        if (r.code !== code) say(`   exit code ${r.code} (JDK: ${code}) ${r.error || ""}`);
        if (!stderr.startsWith(errStart) || (!errStart && stderr)) say(`   stderr ${JSON.stringify(stderr.slice(0, 700))}`);
      }
    }
  } catch (e) {
    say(`FAIL ${e && `${e.name}: ${e.message}${e.cause ? ` (cause: ${e.cause.message || e.cause})` : ""}\n${e.stack || ""}` || e}`);
  }
  const passed = results.filter(([, ok]) => ok).length;
  say(`INFO ${passed} of ${results.length} rows pass; failing: ${results.filter(([, ok]) => !ok).map(([id]) => id).join(", ") || "none"}`);
  say("DONE");
</script></body></html>
